name: Publish Drafts

on:
#  schedule:
#    - cron: '0 0 * * *' # 毎日0時に実行
#  workflow_dispatch:
  push:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0' # 必要に応じてRubyのバージョンを指定

      - name: Run Ruby script
        id: run_script
        run: |
          ruby script/publish_drafts.rb >> $GITHUB_OUTPUT
          echo $GITHUB_OUTPUT
          echo ${{ steps.run_script.outputs.branch_name }}
          echo ${{ steps.run_script.outputs.changes }}
          cat /home/runner/work/_temp/_runner_file_commands/set_output_*

      - name: Create Pull Request
        if: steps.run_script.outputs.changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Publish drafts'
          branch: "${{ steps.run_script.outputs.branch_name }}"
          title: 'Publish drafts'
          body: 'This PR publishes drafts.'
          delete-branch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Slack notification
        if: steps.run_script.outputs.changes == 'true'
        run: |
          echo "レビューお願いします: ${{ steps.create_pr.outputs.pull-request-url }}"
#        uses: 8398a7/action-slack@v3
#        with:
#          status: custom
#          fields: repo,message,commit,author
