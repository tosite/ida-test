name: Publish Drafts

on:
#  schedule:
#    - cron: '0 0 * * *' # 毎日0時に実行
#  workflow_dispatch:
  push:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install

      - name: Run Ruby script
        id: run_script
        run: |
          ruby script/publish_drafts.rb

      - name: Commit changes
        if: steps.run_script.outputs.changes == 'true'
        run: |
          git checkout -b $(date +'%Y%m%d')-publish
          git add entry/*.md
          git commit -m 'Publish drafts for $(date +'%Y-%m-%d')'
          git push --set-upstream origin $(date +'%Y%m%d')-publish

      - name: Create Pull Request
        if: steps.run_script.outputs.changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: $(date +'%Y%m%d')-publish
          title: 'Publish drafts'
          body: 'This PR publishes drafts.'

