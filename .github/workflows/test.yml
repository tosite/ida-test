name: Publish Drafts

on:
#  schedule:
#    - cron: '0 0 * * *' # 毎日0時に実行
#  workflow_dispatch:
  push:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0' # 必要に応じてRubyのバージョンを指定

      - name: Run Ruby script
        id: run_script
        run: |
          ruby script/publish_drafts.rb >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.run_script.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          echo '==== pull ===='
          git pull origin main
          branch_name=$(date +'%Y%m%d')-publish
          echo '==== checkout ===='
          git checkout -b $branch_name
          echo '==== branch ===='
          git branch
          echo '==== status ===='
          git status
          echo '==== add ===='
          git add entry/*.md
          echo '==== status ===='
          git status
          echo '==== commit ===='
          git commit -m 'Publish drafts'
          git pull --rebase origin main
          echo '==== push ===='
          git push origin $branch_name

      - name: Create Pull Request
        if: steps.run_script.outputs.changes == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: $(date +'%Y%m%d')-publish
          title: 'Publish drafts'
          body: 'This PR publishes drafts.'

#      - name: Send Slack notification
